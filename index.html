<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILLAGE | The Architecture of Niche Scent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="main-title">SILLAGE</h1>
            <p class="subtitle">THE ARCHITECTURE OF NICHE SCENT</p>
            <div class="search-wrapper">
                <input type="text" id="perfumeSearch" placeholder="Search by name, house, or note..." autocomplete="off">

        </div>

    <main class="container">
        <div id="perfumeGrid" class="grid">

        <div class="modal-window">
            <button class="close-btn">&times;</button>
            <div id="modalDetails" class="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SILLAGE ARCHIVE. CURATED EXCELLENCE.</p>
    </footer>

    <script src="app.js"></script>
